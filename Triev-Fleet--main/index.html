<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Triev Fleet Manager</title>
  <meta name="google-site-verification" content="fS4_OtobPjrmK0sJbBIxUzctfwL044UqtXqBOuFTlCM" />
  <meta name="description"
    content="The ultimate EV fleet management solution — rider tracking, wallet management, collection analytics, and team leader performance." />
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Triev Fleet" />

  <!-- Icons & PWA -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="apple-touch-icon" href="/pwa-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Critical DNS Prefetch & Preconnect for speed -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="dns-prefetch" href="https://api.elevenlabs.io" />
  <link rel="preconnect" href="https://supabase.co" />
  <link rel="dns-prefetch" href="https://supabase.co" />

  <!-- html2canvas loaded DEFERRED (only when export is used, not blocking) -->
  <script>
    window.loadHtml2Canvas = function() {
      return new Promise(function(resolve) {
        if (window.html2canvas) { resolve(window.html2canvas); return; }
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
        s.onload = function() { resolve(window.html2canvas); };
        document.head.appendChild(s);
      });
    };
  </script>
</head>

<body>
  <div id="root">
    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: system-ui; gap: 12px;">
      <div style="width: 40px; height: 40px; border: 3px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      <span style="font-size: 14px; color: #64748b; font-weight: 500;">Triev Fleet V2 Loading...</span>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
